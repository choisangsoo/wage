<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>월급 미터기 | 월급 계산기, 시급 미터기, 일급 계산기</title>
    <meta
      name="description"
      content="시급 미터기, 월급 미터기, 월급 계산기, 연봉 계산기, 일급 계산기. 출퇴근 시간 기준으로 급여가 실시간으로 쌓이는 급여 미터기입니다."
    />
    <meta
      name="keywords"
      content="월급 계산기, 미터기, 시급 미터기, 월급 미터기, 시급 계산기, 일급 계산기, 연봉 계산기, 급여 미터기, 실시간 급여, 하루 정산"
    />
    <meta name="author" content="시급 미터기" />
    <link rel="canonical" href="https://choisangsoo.github.io/wage/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="시급 미터기 | 월급 계산기, 월급 미터기" />
    <meta
      property="og:description"
      content="월급 계산기, 시급 미터기, 월급 미터기, 일급 계산기. 근무 시간 동안 급여가 실시간으로 올라갑니다."
    />
    <meta property="og:url" content="https://choisangsoo.github.io/wage/" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="site-drawer" id="site-drawer" aria-hidden="true" aria-label="사이트 메뉴">
      <div class="drawer-head">
        <span>메뉴</span>
        <button type="button" class="drawer-close" id="drawer-close">닫기</button>
      </div>
      <nav>
        <a href="index.html" aria-current="page">미터기</a>
        <a href="about.html">소개</a>
        <a href="privacy.html">개인정보처리방침</a>
        <a href="contact.html">문의</a>
        <a href="ads.html">광고/제휴</a>
      </nav>
    </aside>
    <main class="app">
      <div class="app-head">
        <h1>급여 미터기</h1>
        <button type="button" class="menu-btn" id="menu-btn" aria-controls="site-drawer" aria-expanded="false" aria-label="메뉴 열기">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <section class="meter" aria-live="polite">
        <div class="meter-top">
          <span>오늘의 요금</span>
          <span id="status-pill">대기</span>
        </div>
        <p id="fare" class="fare">₩ 0</p>
        <p id="elapsed" class="elapsed">00:00:00</p>
        <dl class="stats">
          <div>
            <dt>시급</dt>
            <dd id="hourly">—</dd>
          </div>
          <div>
            <dt>초당</dt>
            <dd id="per-second">—</dd>
          </div>
          <div>
            <dt id="daily-label">하루 정산</dt>
            <dd id="daily">—</dd>
          </div>
        </dl>
        <dl class="stats">
          <div>
            <dt>부양가족</dt>
            <dd id="family-count">—</dd>
          </div>
          <div>
            <dt>20세 이하 자녀</dt>
            <dd id="child-count">—</dd>
          </div>
          <div>
            <dt>월 비과세액</dt>
            <dd id="tax-free">—</dd>
          </div>
        </dl>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>근무 설정</h2>
          <p id="save-note" class="save-note">저장하면 이 값이 기본값이 됩니다.</p>
        </div>
        <form id="settings-form" class="form" novalidate>
          <label class="field">
            <span>급여 기준</span>
            <select id="pay-type" name="payType">
              <option value="annual">연봉</option>
              <option value="monthly">월급</option>
              <option value="daily">일급</option>
            </select>
          </label>
          <label class="field">
            <span id="amount-label">연봉</span>
            <div class="field-row">
              <input
                id="salary"
                name="salary"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="50,000,000"
              />
              <em>원</em>
            </div>
          </label>
          <div class="time-grid">
            <label class="field">
              <span>출근</span>
              <input id="start-time" name="startTime" type="time" required />
            </label>
            <label class="field">
              <span>퇴근</span>
              <input id="end-time" name="endTime" type="time" required />
            </label>
          </div>
          <div class="time-grid">
            <label class="field">
              <span>부양가족수(본인포함)</span>
              <div class="field-row">
                <input
                  id="dependents"
                  name="dependents"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  max="20"
                  step="1"
                  required
                />
                <em>명</em>
              </div>
            </label>
            <label class="field">
              <span>20세 이하 자녀수</span>
              <div class="field-row">
                <input
                  id="children"
                  name="children"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  max="19"
                  step="1"
                  required
                />
                <em>명</em>
              </div>
            </label>
          </div>
          <p class="hint">월 비과세액 = 기본공제(1인 연 150만원) ÷ 12 + 자녀세액공제(2026 간이세액표, 8~20세)</p>
          <p id="form-error" class="form-error" hidden></p>
          <button type="submit" class="save-btn">저장하고 미터 시작</button>
        </form>
      </section>
    </main>
    <script src="nav.js"></script>
    <script src="app.js"></script>
  </body>
</html>
